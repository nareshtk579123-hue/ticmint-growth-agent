name: Ticmint Growth Agent Scheduled Run

on:
  workflow_dispatch:
  schedule:
    # Run at minute 17 of every 6th hour (00:17, 06:17, 12:17, 18:17 UTC)
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  run-growth-agent:
    name: Execute Growth Intelligence Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: pytest -v

      - name: Execute Autonomous Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_RAW_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_RAW_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          RUN_MODE: "live"
          MAX_SIGNALS_PER_RUN: "25"
        run: python -m app.agent
